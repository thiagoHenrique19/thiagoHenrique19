<svg xmlns="http://www.w3.org/2000/svg" width="860" height="432" viewBox="0 0 860 432" role="img" aria-label="Terminal: GET /dev/thiago retorna Thiago Henrique, Desenvolvedor de Software Jr na Segala's Alimentos, desde 2023">
<style>
text{font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace;font-size:17px;white-space:pre}
.l{opacity:0;animation:ln 12s infinite backwards}
@keyframes ln{0%{opacity:0}1%{opacity:1}90%{opacity:1}96%,100%{opacity:0}}
.c{animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.p{animation:pu 2.4s ease-in-out infinite}
@keyframes pu{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.l{animation:none;opacity:1}.c,.p{animation:none}}
</style>
<rect width="860" height="432" rx="14" fill="#0a0a0a"/>
<rect x="0.5" y="0.5" width="859" height="431" rx="14" fill="none" stroke="#262624"/>
<rect x="1" y="1" width="858" height="52" rx="13" fill="#141414"/>
<rect x="1" y="38" width="858" height="15" fill="#141414"/>
<line x1="1" y1="53" x2="859" y2="53" stroke="#262624"/>
<circle cx="34" cy="27" r="6" fill="#262624"/>
<circle cx="56" cy="27" r="6" fill="#262624"/>
<circle cx="78" cy="27" r="6" fill="#262624"/>
<text x="430" y="32" text-anchor="middle" fill="#9a9a93" style="font-size:13px">thiago@dev ~ API</text>
<circle class="p" cx="796" cy="27" r="4" fill="#c8ff3c"/><text x="808" y="32" fill="#9a9a93" style="font-size:12px">200 OK</text>
<text class="l" x="36" y="108" style="animation-delay:0.35s"><tspan fill="#c8ff3c">$ </tspan><tspan fill="#c8ff3c">GET </tspan><tspan fill="#ecebe6">/dev/thiago</tspan></text>
<text class="l" x="36" y="136" style="animation-delay:0.67s"><tspan fill="#9a9a93">{</tspan></text>
<text class="l" x="36" y="164" style="animation-delay:0.99s"><tspan fill="#9a9a93">  "nome": </tspan><tspan fill="#ecebe6">"Thiago Henrique"</tspan><tspan fill="#9a9a93">,</tspan></text>
<text class="l" x="36" y="192" style="animation-delay:1.31s"><tspan fill="#9a9a93">  "cargo": </tspan><tspan fill="#ecebe6">"Desenvolvedor de Software Jr"</tspan><tspan fill="#9a9a93">,</tspan></text>
<text class="l" x="36" y="220" style="animation-delay:1.63s"><tspan fill="#9a9a93">  "empresa": </tspan><tspan fill="#ecebe6">"Segala's Alimentos"</tspan><tspan fill="#9a9a93">,</tspan></text>
<text class="l" x="36" y="248" style="animation-delay:1.95s"><tspan fill="#9a9a93">  "desde": </tspan><tspan fill="#ecebe6">2023</tspan><tspan fill="#9a9a93">,</tspan></text>
<text class="l" x="36" y="276" style="animation-delay:2.27s"><tspan fill="#9a9a93">  "back": </tspan><tspan fill="#ecebe6">["Java", "Spring", "MySQL", "PostgreSQL", "Oracle"]</tspan><tspan fill="#9a9a93">,</tspan></text>
<text class="l" x="36" y="304" style="animation-delay:2.59s"><tspan fill="#9a9a93">  "front": </tspan><tspan fill="#ecebe6">["React", "TypeScript", "Tailwind"]</tspan><tspan fill="#9a9a93">,</tspan></text>
<text class="l" x="36" y="332" style="animation-delay:2.91s"><tspan fill="#9a9a93">  "cloud": </tspan><tspan fill="#ecebe6">["AWS", "Docker"]</tspan><tspan fill="#9a9a93">,</tspan></text>
<text class="l" x="36" y="360" style="animation-delay:3.23s"><tspan fill="#9a9a93">  "status": </tspan><tspan fill="#c8ff3c">"disponível"</tspan></text>
<text class="l" x="36" y="388" style="animation-delay:3.55s"><tspan fill="#9a9a93">}</tspan></text>
<text class="l" x="36" y="422" style="animation-delay:3.87s"><tspan fill="#c8ff3c">$ </tspan></text>
<rect class="c" x="56" y="406" width="10" height="20" fill="#c8ff3c"/>
</svg>